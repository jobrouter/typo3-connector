name: CI

permissions: {}

on:
  push:
    paths:
      - 'Build/**'
      - 'composer.json'
      - '.github/workflows/ci.yml'
      - '**.php'
  pull_request:
    paths:
      - 'Build/**'
      - 'composer.json'
      - '.github/workflows/ci.yml'
      - '**.php'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build PHP/TYPO3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-versions: '8.2'
            typo3-versions: '13'
          - php-versions: '8.2'
            typo3-versions: '14'
          - php-versions: '8.3'
            typo3-versions: '13'
          - php-versions: '8.3'
            typo3-versions: '14'
          - php-versions: '8.4'
            typo3-versions: '13'
          - php-versions: '8.4'
            typo3-versions: '14'
          - php-versions: '8.5'
            typo3-versions: '13'
          - php-versions: '8.5'
            typo3-versions: '14'
    env:
      PHP_VERSION: ${{ matrix.php-versions }}
      TYPO3_VERSION: ${{ matrix.typo3-versions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup PHP version
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: fileinfo gd intl json mbstring mysqli openssl pcre pdo session sodium xml zip zlib
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install composer dependencies
        run: |
          composer remove ergebnis/composer-normalize --dev --no-update
          composer require typo3/cms-core="^$TYPO3_VERSION" --no-progress --prefer-dist --optimize-autoloader
      - name: Run PHP linter
        run: |
          make lint-php
      - name: Run unit tests
        run: |
          make tests-php-unit
      - name: Run functional tests
        run: |
          ./Build/Scripts/runTests.sh -b docker -s functional -p "$PHP_VERSION"
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup PHP version
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: 8.2
          coverage: xdebug
          extensions: mbstring
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install composer dependencies
        run: |
          composer update --no-progress --prefer-dist --optimize-autoloader
      - name: Normalize composer.json
        run: |
          composer normalize --dry-run
      - name: Check coding standards
        run: |
          .Build/bin/ecs check --no-progress-bar
      - name: Run phpstan
        run: |
          make stan
      - name: Run rector
        run: |
          make rector-check
